name: Reader repro

# Runs when a commit message contains [repro]; pushes screenshots to the repro-shots branch.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repro:
    if: contains(github.event.head_commit.message, '[repro]')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build for the emulator
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -Pfwip.abis=x86_64 --console=plain
      - name: Test comics
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rar > /dev/null
          python3 -m pip install --quiet pillow
          python3 scripts/repro_comics.py comics
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Turn pages
        timeout-minutes: 30
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 4G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: false
          script: bash scripts/repro.sh
      - name: Push screenshots
        if: always()
        run: |
          mkdir -p /tmp/shots && cp -r repro/. /tmp/shots/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan repro-shots
          git rm -rf -q . > /dev/null
          cp -r /tmp/shots/. .
          git add -A
          git commit -q -m "Repro screenshots for ${GITHUB_SHA::7}"
          git push -f origin repro-shots
