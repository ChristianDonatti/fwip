name: Reader repro

# Runs when a commit message contains [repro]; pushes screenshots to the repro-shots branch.
on:
  push:
    branches: [main, books, book3d, ux]

permissions:
  contents: write

jobs:
  repro:
    if: contains(github.event.head_commit.message, '[repro]') || contains(github.event.head_commit.message, '[uicheck]') || contains(github.event.head_commit.message, '[nascheck]') || contains(github.event.head_commit.message, '[newcheck]') || contains(github.event.head_commit.message, '[lookcheck]') || contains(github.event.head_commit.message, '[setcheck]') || contains(github.event.head_commit.message, '[bookcheck]') || contains(github.event.head_commit.message, '[uxcheck]') || contains(github.event.head_commit.message, '[3dcheck]') || contains(github.event.head_commit.message, '[updcheck]') || contains(github.event.head_commit.message, '[tourcheck]')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build for the emulator
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          chmod +x gradlew
          # The update check starts from an old build, so the test build on GitHub is newer.
          if echo "$MSG" | grep -q '\[updcheck\]'; then export FWIP_VERSION_CODE=5; fi
          ./gradlew assembleDebug -Pfwip.abis=x86_64 --console=plain
          # The emulator needs the memory more than Gradle's idle daemons do.
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true
          free -m
      - name: Test comics
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rar > /dev/null
          python3 -m pip install --quiet pillow
          python3 scripts/repro_comics.py comics
          python3 scripts/sample_comics.py comics
          python3 scripts/sample_books.py books
      - name: NAS for the upload check
        if: contains(github.event.head_commit.message, '[nascheck]')
        run: |
          sudo apt-get install -y -qq samba > /dev/null
          mkdir -p /tmp/nas/HQs
          cp comics/PepperCarrot_03.cbz comics/PepperCarrot_08.cbz /tmp/nas/HQs/
          chmod -R a+rwX /tmp/nas
          sudo useradd -M fwip || true
          (echo fwippass; echo fwippass) | sudo smbpasswd -a -s fwip
          printf '[Comics]\n  path = /tmp/nas\n  read only = no\n  valid users = fwip\n  force user = runner\n' | sudo tee -a /etc/samba/smb.conf > /dev/null
          sudo systemctl restart smbd
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Turn pages
        timeout-minutes: 30
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 4G
          emulator-options: -no-window -gpu ${{ contains(github.event.head_commit.message, '[guestgpu]') && 'guest' || 'swiftshader_indirect' }} -noaudio -no-boot-anim -no-snapshot
          disable-animations: false
          script: bash scripts/${{ contains(github.event.head_commit.message, '[tourcheck]') && 'tour_check.sh' || contains(github.event.head_commit.message, '[updcheck]') && 'update_check.sh' || contains(github.event.head_commit.message, '[3dcheck]') && 'book3d_check.sh' || contains(github.event.head_commit.message, '[uxcheck]') && 'ux_check.sh' || contains(github.event.head_commit.message, '[bookcheck]') && 'books_check.sh' || contains(github.event.head_commit.message, '[setcheck]') && 'settings_check.sh' || contains(github.event.head_commit.message, '[lookcheck]') && 'look_check.sh' || contains(github.event.head_commit.message, '[newcheck]') && 'new_check.sh' || (contains(github.event.head_commit.message, '[nascheck]') && 'nas_check.sh' || (contains(github.event.head_commit.message, '[uicheck]') && 'ui_check.sh' || 'repro.sh')) }}
      - name: Host memory after the run
        if: always()
        run: |
          free -m
          sudo dmesg | grep -i -E "out of memory|killed process|oom" | tail -n 20 | tee repro/host-oom.txt || true
      - name: Push screenshots
        if: always()
        run: |
          mkdir -p /tmp/shots && cp -r repro/. /tmp/shots/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan repro-shots
          git rm -rf -q . > /dev/null
          cp -r /tmp/shots/. .
          git add -A
          git commit -q -m "Repro screenshots for ${GITHUB_SHA::7}"
          git push -f origin repro-shots
