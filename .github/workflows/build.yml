name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        env:
          FWIP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk fwip.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fwip-apk
          path: fwip.apk

      # Keeps one always-up-to-date download at Releases > "Versão de teste".
      - name: Publish test build
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete teste --yes --cleanup-tag || true
          gh release create teste fwip.apk \
            --prerelease \
            --title "Versão de teste (build ${{ github.run_number }})" \
            --notes "APK gerado automaticamente a partir do commit ${GITHUB_SHA::7}. Baixe o arquivo fwip.apk abaixo e abra no tablet ou celular para instalar."
