name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        env:
          FWIP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --console=plain 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Surface the real errors as annotations so they show up on the run page.
            grep -E '^e: ' build.log | sed 's#.*/fwip/app/src/main/java/io/github/christiandonatti/fwip/##' | head -45 \
              | awk '{printf "%s%%0A", $0} NR%5==0 {print ""} END {print ""}' | grep . | sed 's/^/::error::/' | head -9 || true
            awk '/What went wrong:/{f=1} f{print} /Try:/{exit}' build.log | head -30 | awk '{printf "%s%%0A", $0}' | sed 's/^/::error::/' || true
            echo
            exit "$status"
          fi
          cp app/build/outputs/apk/release/app-release.apk fwip.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fwip-apk
          path: fwip.apk

      # Keeps one always-up-to-date download at Releases > "Versão de teste".
      - name: Publish test build
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete teste --yes --cleanup-tag || true
          gh release create teste fwip.apk \
            --prerelease \
            --title "Versão de teste (build ${{ github.run_number }})" \
            --notes "APK gerado automaticamente a partir do commit ${GITHUB_SHA::7}. Baixe o arquivo fwip.apk abaixo e abra no tablet ou celular para instalar."
