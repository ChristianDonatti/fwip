name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        env:
          FWIP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --console=plain 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Surface the real errors as annotations so they show up on the run page.
            grep -E '^e: ' build.log | sed 's#.*/fwip/app/src/main/java/io/github/christiandonatti/fwip/##' | head -45 \
              | awk '{printf "%s%%0A", $0} NR%5==0 {print ""} END {print ""}' | grep . | sed 's/^/::error::/' | head -9 || true
            awk '/What went wrong:/{f=1} f{print} /Try:/{exit}' build.log | head -30 | awk '{printf "%s%%0A", $0}' | sed 's/^/::error::/' || true
            echo
            exit "$status"
          fi
          cp app/build/outputs/apk/release/app-release.apk fwip.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fwip-apk
          path: fwip.apk

      # Keeps one always-up-to-date download at Releases > "Versão de teste".
      - name: Publish test build
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGE: ${{ github.event.head_commit.message }}
        run: |
          gh release delete teste --yes --cleanup-tag || true
          subject=$(printf '%s' "$CHANGE" | head -1)
          notes=$(printf '%s\n\n%s' "$subject" "APK gerado automaticamente a partir do commit ${GITHUB_SHA::7}. Baixe o arquivo fwip.apk abaixo e abra no tablet ou celular para instalar.")
          gh release create teste fwip.apk \
            --prerelease \
            --title "Versão de teste (build ${{ github.run_number }})" \
            --notes "$notes"

  # Reads real comics from a Samba share, the way the app does with a NAS.
  network-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Samba share with test comics
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq samba rar zip > /dev/null
          mkdir -p /tmp/fwip/pages /tmp/fwip/share/Sub
          python3 - <<'PY'
          import struct, zlib, random
          def png(w, h, seed):
              random.seed(seed)
              rows = b''.join(b'\x00' + bytes(random.randrange(256) for _ in range(w * 3)) for _ in range(h))
              def chunk(t, d): return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(rows)) + chunk(b'IEND', b'')
          for i in range(1, 4):
              open(f'/tmp/fwip/pages/p{i}.png', 'wb').write(png(120, 180, i))
          PY
          cd /tmp/fwip/pages
          zip -q ../share/Test.cbz p1.png p2.png p3.png
          # Current rar only writes RAR5; RAR4 samples come from junrar's own test files.
          rar a -s -idq ../share/New.cbr p1.png p2.png p3.png
          junrar=https://raw.githubusercontent.com/junrar/junrar/v7.5.5/src/test/resources/com/github/junrar
          curl -sSfL -o ../share/Plain.cbr "$junrar/tika-documents.rar"
          curl -sSfL -o ../share/Sub/Solid.cbr "$junrar/solid/rar4-solid.rar"
          chmod -R a+rwX /tmp/fwip
          sudo useradd -M fwip || true
          (echo fwippass; echo fwippass) | sudo smbpasswd -a -s fwip
          printf '[Comics]\n  path = /tmp/fwip/share\n  read only = no\n  valid users = fwip\n  force user = runner\n' | sudo tee -a /etc/samba/smb.conf > /dev/null
          sudo systemctl restart smbd
          ls -la /tmp/fwip/share /tmp/fwip/share/Sub

      - name: Read comics over SMB
        env:
          FWIP_SMB: 127.0.0.1/Comics
          FWIP_SMB_USER: fwip
          FWIP_SMB_PASS: fwippass
          FWIP_PAGES: /tmp/fwip/pages
          FWIP_SHARE: /tmp/fwip/share
        run: |
          chmod +x gradlew
          set +e
          ./gradlew testReleaseUnitTest --console=plain 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            grep -E '^e: |FAILED|Exception|expected|at io.github' test.log | head -40 | awk '{printf "%s%%0A", $0}' | sed 's/^/::error::/' || true
            for f in app/build/test-results/testReleaseUnitTest/*.xml; do
              grep -A8 '<failure' "$f" | head -30 | awk '{printf "%s%%0A", $0}' | sed 's/^/::error::/' || true
              echo
            done
            exit "$status"
          fi
          grep -h '<testcase' app/build/test-results/testReleaseUnitTest/*.xml | sed 's/^/::notice::/' || true

      - name: Upload speed over a slow network
        env:
          FWIP_SMB: 127.0.0.1/Comics
          FWIP_SMB_USER: fwip
          FWIP_SMB_PASS: fwippass
        run: |
          speed() {
            FWIP_SPEED="$1" ./gradlew testReleaseUnitTest --tests '*NetSpeedTest*' --rerun --console=plain > /dev/null 2>&1 || true
            echo "::notice::$(grep -ho 'SPEED .*' app/build/test-results/testReleaseUnitTest/*NetSpeedTest*.xml | sed 's/^SPEED //' | tr '\n' '|')" || true
          }
          # About 4 ms round trip, like a good Wi-Fi; then 20 ms, like a busy one.
          sudo tc qdisc add dev lo root netem delay 2ms
          speed wifi4ms
          sudo tc qdisc change dev lo root netem delay 10ms
          speed wifi20ms
          # What signing costs, when the NAS asks for it.
          sudo tc qdisc change dev lo root netem delay 2ms
          sudo sed -i 's/^\[global\]/[global]\n   server signing = mandatory/' /etc/samba/smb.conf
          sudo systemctl restart smbd
          speed signed4ms
          # A NAS that only takes 64 KB per request (old SMB 2.0 settings).
          sudo sed -i 's/^\[global\]/[global]\n   smb2 max read = 65536\n   smb2 max write = 65536/' /etc/samba/smb.conf
          sudo systemctl restart smbd
          speed small64k
          sudo tc qdisc del dev lo root || true

