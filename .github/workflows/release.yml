name: Release

# Publishes a release signed with the private key: push a tag like v0.3.0, or run this
# workflow from the Actions tab and type the version (the tag is then created for you).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, like 0.3.0'
        required: true
        default: '0.3.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.FWIP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The release key secrets are missing. See RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          FWIP_KEYSTORE: ${{ runner.temp }}/release.jks
          FWIP_KEYSTORE_PASSWORD: ${{ secrets.FWIP_KEYSTORE_PASSWORD }}
          FWIP_KEY_ALIAS: ${{ secrets.FWIP_KEY_ALIAS }}
          FWIP_KEY_PASSWORD: ${{ secrets.FWIP_KEY_PASSWORD }}
        run: |
          version="${{ github.event.inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          version="${version#v}"
          IFS=. read -r major minor patch <<< "$version"
          export FWIP_VERSION_NAME="$version"
          export FWIP_VERSION_CODE=$(( major * 10000 + minor * 100 + ${patch:-0} ))
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk "fwip-$version.apk"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "CODE=$FWIP_VERSION_CODE" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="fastlane/metadata/android/en-US/changelogs/$CODE.txt"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "v$VERSION" "fwip-$VERSION.apk" --target "$GITHUB_SHA" --title "Fwip $VERSION" --notes-file "$notes"
