name: Screenshots

# Runs when a commit message contains [screenshots]; commits the pictures back to docs/ and fastlane/.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  screenshots:
    if: contains(github.event.head_commit.message, '[screenshots]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build for the emulator
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -Pfwip.abis=x86_64 --console=plain

      - name: Sample comics (Pepper&Carrot, CC BY 4.0)
        run: |
          mkdir -p comics
          python3 scripts/sample_comics.py comics
          ls -la comics

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 4G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: false
          script: bash scripts/screenshots.sh

      - name: Save screenshots
        run: |
          ls shots
          mkdir -p docs/screenshots
          cp shots/*.png docs/screenshots/
          for l in en-US pt-BR; do
            d=fastlane/metadata/android/$l/images
            rm -f $d/phoneScreenshots/*.png $d/tenInchScreenshots/*.png
            cp shots/phone-*.png $d/phoneScreenshots/ 2>/dev/null || true
            cp shots/tablet-*.png $d/tenInchScreenshots/ 2>/dev/null || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots fastlane
          git commit -m "Screenshots from the emulator" || exit 0
          git pull --rebase
          git push
